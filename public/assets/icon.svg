<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014" />
      <stop offset="100%" stop-color="#1b002c" />
    </linearGradient>
    
    <!-- Neon Pink Glow -->
    <filter id="neonPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Blue Glow -->
    <filter id="neonBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="492" height="492" x="10" y="10" rx="90" fill="none" stroke="#ff2d78" stroke-width="4" opacity="0.4" />

  <!-- Outer Star Accent -->
  <path d="M 256,40 L 300,160 L 430,160 L 325,235 L 365,360 L 256,285 L 147,360 L 187,235 L 82,160 L 212,160 Z" 
        fill="none" stroke="#00d4ff" stroke-width="3" filter="url(#neonBlue)" opacity="0.3" />

  <!-- Guitar Silhouette and R Design -->
  <g filter="url(#neonPink)">
    <!-- Guitar neck and headstock -->
    <rect x="246" y="80" width="20" height="220" fill="#ff2d78" rx="4" />
    <path d="M 236,70 L 276,70 L 266,40 L 246,40 Z" fill="#ff2d78" />
    
    <!-- Guitar Body / Capital R shape hybrid -->
    <path d="M 216,260 C 180,260 160,290 160,320 C 160,360 200,380 256,380 C 312,380 352,360 352,320 C 352,290 332,260 296,260 Z" fill="#ff2d78" opacity="0.8" />
    
    <!-- Inner design details: Neon String lines -->
    <line x1="251" y1="80" x2="251" y2="360" stroke="#00d4ff" stroke-width="2" filter="url(#neonBlue)" />
    <line x1="261" y1="80" x2="261" y2="360" stroke="#00d4ff" stroke-width="2" filter="url(#neonBlue)" />
  </g>

  <!-- Star Centerpiece -->
  <polygon points="256,220 270,260 310,260 278,285 290,325 256,300 222,325 234,285 202,260 242,260" 
           fill="#ffd700" filter="url(#neonBlue)" />

  <!-- Foreground letter "R" -->
  <text x="256" y="340" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle" shadow="0 0 10px #ff2d78">R</text>
</svg>
